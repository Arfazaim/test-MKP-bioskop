<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Zanema - Pemesanan Tiket Bioskop Online</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,800&display=swap" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'],
            body: ['Inter', '"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            brand: {
              red: '#E50914',
              crimson: '#E50914',
              dark: '#131317',
              card: '#1F1F23',
              accent: '#2A292E'
            }
          }
        }
      }
    }
  </script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .tabular-nums { font-variant-numeric: tabular-nums; }
    @media print {
      header, #thumbnails-bar, footer, .no-print { display: none !important; }
      body { background: #fff !important; padding: 0 !important; }
    }
  </style>
</head>
<body class="bg-[#120304] text-slate-100 min-h-screen font-sans flex items-start lg:items-center justify-center p-2 sm:p-5 lg:p-7 antialiased selection:bg-[#e50914] selection:text-white">

  <!-- Main Neo-Brutalist Shell (Zanema) -->
  <div class="relative w-full max-w-[1360px] bg-[#131317] rounded-none border-[3px] border-white/90 shadow-[8px_8px_0px_#e50914] overflow-hidden flex flex-col min-h-[88vh]">

    <!-- Navigation Bar -->
    <header class="relative z-20 flex flex-wrap items-center justify-between gap-3 px-5 lg:px-10 py-4 border-b-[3px] border-white/80 bg-[#131317]">
      <!-- Left Nav Switches -->
      <nav class="flex items-center flex-wrap gap-2.5" id="main-nav">
        <button data-nav="katalog" class="nav-pill flex items-center space-x-2 bg-[#e50914] text-white text-xs lg:text-sm font-extrabold uppercase tracking-wide px-4 py-2 rounded-none border-2 border-white shadow-[4px_4px_0px_#000000] transition-transform hover:-translate-x-0.5 hover:-translate-y-0.5">
          <i class="fa-solid fa-shapes text-xs"></i>
          <span>Katalog Film</span>
        </button>
        <button data-nav="bioskop" class="nav-pill flex items-center space-x-2 bg-[#1f1f23] hover:bg-[#2a292e] text-slate-200 text-xs lg:text-sm font-bold uppercase tracking-wide px-4 py-2 rounded-none border-2 border-white/70 shadow-[4px_4px_0px_#000000] transition-all hover:-translate-x-0.5 hover:-translate-y-0.5">
          <i class="fa-solid fa-film text-xs text-slate-300"></i>
          <span>Jadwal &amp; Bioskop</span>
        </button>
        <button data-nav="tiket-saya" class="nav-pill flex items-center space-x-2 bg-[#1f1f23] hover:bg-[#2a292e] text-slate-200 text-xs lg:text-sm font-bold uppercase tracking-wide px-4 py-2 rounded-none border-2 border-white/70 shadow-[4px_4px_0px_#000000] transition-all hover:-translate-x-0.5 hover:-translate-y-0.5">
          <i class="fa-solid fa-ticket text-xs text-slate-300"></i>
          <span>Tiket Saya</span>
          <span id="my-tickets-badge" class="hidden px-1.5 py-0.5 rounded-none bg-[#e50914] border border-white text-white text-[10px] font-extrabold leading-none">0</span>
        </button>
        <button data-nav="admin" id="admin-nav-btn" class="nav-pill hidden items-center space-x-2 bg-amber-400 hover:bg-amber-300 text-black text-xs lg:text-sm font-extrabold uppercase tracking-wide px-4 py-2 rounded-none border-2 border-white shadow-[4px_4px_0px_#000000] transition-all hover:-translate-x-0.5 hover:-translate-y-0.5">
          <i class="fa-solid fa-sliders text-xs"></i>
          <span>Kelola Jadwal</span>
        </button>
      </nav>

      <!-- Center Brand Logo -->
      <div class="flex items-center space-x-1 order-first sm:order-none">
        <button onclick="window.app.navigate('katalog')" class="text-2xl font-black italic tracking-wider flex items-center select-none group">
          <span class="text-[#e50914] group-hover:text-red-400 transition-colors">ZA</span>
          <span class="text-white">NEMA</span>
          <span class="inline-block w-2.5 h-2.5 rounded-none bg-[#e50914] border border-white ml-1.5"></span>
        </button>
      </div>

      <!-- Right Search & Auth Profile -->
      <div class="flex items-center space-x-3">
        <div class="relative hidden xl:block w-60">
          <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-xs text-slate-300"></i>
          <input id="global-search" type="text" placeholder="Cari film atau bioskop..." class="w-full bg-[#1f1f23] text-xs font-semibold text-white placeholder-slate-400 pl-9 pr-3.5 py-2 rounded-none border-2 border-white/70 shadow-[3px_3px_0px_#000000] focus:outline-none focus:border-[#e50914] focus:ring-0 transition-all"/>
        </div>

        <!-- Auth Container -->
        <div id="auth-bar" class="flex items-center gap-2"></div>
      </div>
    </header>

    <!-- Horizontal Movie Thumbnails Strip -->
    <div id="thumbnails-bar" class="relative px-5 lg:px-10 pt-5 pb-2 z-20">
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-xs uppercase tracking-widest text-white font-extrabold flex items-center gap-2.5">
          <span>Sedang Tayang Di Bioskop</span>
          <span id="movie-count-badge" class="px-2 py-0.5 rounded-none bg-[#e50914] border-2 border-black text-[10px] font-extrabold text-white shadow-[2px_2px_0px_#000000]">0 Film</span>
        </h2>
        <div class="flex items-center space-x-2">
          <button type="button" onclick="window.app.scrollThumbnails(-260)" class="w-7 h-7 rounded-none bg-[#1f1f23] hover:bg-[#2a292e] text-white flex items-center justify-center transition-all border-2 border-white/60 shadow-[2px_2px_0px_#000000] active:translate-x-[1px] active:translate-y-[1px] active:shadow-none" aria-label="Geser Kiri">
            <i class="fa-solid fa-chevron-left text-[10px]"></i>
          </button>
          <button type="button" onclick="window.app.scrollThumbnails(260)" class="w-7 h-7 rounded-none bg-[#1f1f23] hover:bg-[#2a292e] text-white flex items-center justify-center transition-all border-2 border-white/60 shadow-[2px_2px_0px_#000000] active:translate-x-[1px] active:translate-y-[1px] active:shadow-none" aria-label="Geser Kanan">
            <i class="fa-solid fa-chevron-right text-[10px]"></i>
          </button>
        </div>
      </div>
      <div id="movie-thumbnails" class="flex items-center space-x-3.5 overflow-x-auto no-scrollbar py-2"></div>
    </div>

    <!-- Dynamic Main Viewport -->
    <main id="app-view" class="relative z-10 px-5 lg:px-10 py-6 flex-1 flex flex-col justify-center overflow-x-hidden"></main>
  </div>

  <!-- Auth Modal (Login & Register - Neo-Brutalism) -->
  <div id="auth-modal" class="hidden fixed inset-0 z-50 bg-black/85 flex items-center justify-center p-4">
    <div class="relative w-full max-w-md bg-[#1f1f23] border-[3px] border-white rounded-none p-6 sm:p-8 shadow-[8px_8px_0px_#e50914]">
      <button onclick="window.app.closeAuthModal()" class="absolute right-4 top-4 w-9 h-9 rounded-none bg-[#131317] hover:bg-[#e50914] text-white border-2 border-white shadow-[3px_3px_0px_#000000] flex items-center justify-center transition-colors">
        <i class="fa-solid fa-xmark"></i>
      </button>

      <div class="mb-5">
        <div class="text-xl font-black italic tracking-wider mb-1 flex items-center">
          <span class="text-[#e50914]">ZA</span><span class="text-white">NEMA</span>
          <span class="inline-block w-2 h-2 rounded-none bg-[#e50914] border border-white ml-1.5"></span>
        </div>
        <h3 id="auth-modal-title" class="text-xl font-extrabold uppercase tracking-tight text-white">Masuk ke Akun Anda</h3>
        <p class="text-xs text-slate-300 mt-1">Masuk untuk memilih kursi, membayar tiket, atau mengelola jadwal tayang.</p>
      </div>

      <!-- Mode Tabs -->
      <div class="grid grid-cols-2 gap-2 mb-5">
        <button id="tab-login" onclick="window.app.switchAuthTab('login')" class="py-2.5 text-xs font-extrabold uppercase tracking-wider rounded-none bg-[#e50914] text-white border-2 border-white shadow-[3px_3px_0px_#000000] transition-all">Masuk</button>
        <button id="tab-register" onclick="window.app.switchAuthTab('register')" class="py-2.5 text-xs font-bold uppercase tracking-wider rounded-none bg-[#131317] text-slate-300 hover:text-white border-2 border-white/60 shadow-[3px_3px_0px_#000000] transition-all">Daftar Baru</button>
      </div>

      <!-- Quick Demo Accounts -->
      <div id="demo-accounts-box" class="mb-4 p-3.5 rounded-none bg-[#131317] border-2 border-white/60 shadow-[3px_3px_0px_#000000]">
        <p class="text-[11px] text-slate-300 mb-2 font-bold uppercase tracking-wide">Akun contoh siap pakai (klik isi otomatis):</p>
        <div class="flex flex-wrap gap-2">
          <button type="button" onclick="window.app.fillDemo('arfa@cinema.com','password')" class="px-2.5 py-1 rounded-none bg-[#1f1f23] hover:bg-[#2a292e] text-[11px] font-bold text-white border-2 border-white/70 shadow-[2px_2px_0px_#000000]">Pelanggan: Arfa</button>
          <button type="button" onclick="window.app.fillDemo('zaim@cinema.com','password')" class="px-2.5 py-1 rounded-none bg-[#1f1f23] hover:bg-[#2a292e] text-[11px] font-bold text-white border-2 border-white/70 shadow-[2px_2px_0px_#000000]">Pelanggan: Zaim</button>
          <button type="button" onclick="window.app.fillDemo('admin@cinema.com','admin123')" class="px-2.5 py-1 rounded-none bg-amber-400 hover:bg-amber-300 text-[11px] font-extrabold text-black border-2 border-black shadow-[2px_2px_0px_#000000]">Admin Bioskop</button>
        </div>
      </div>

      <form id="auth-form" class="space-y-3.5">
        <div id="field-fullname" class="hidden">
          <label class="block text-xs font-extrabold uppercase tracking-wider text-slate-200 mb-1">Nama Lengkap</label>
          <input id="auth-fullname" type="text" placeholder="Contoh: Rina Putri" class="w-full bg-[#131317] text-sm font-medium text-white px-4 py-2.5 rounded-none border-2 border-white/80 shadow-[3px_3px_0px_#000000] focus:outline-none focus:border-[#e50914] focus:ring-0"/>
        </div>
        <div>
          <label class="block text-xs font-extrabold uppercase tracking-wider text-slate-200 mb-1">Email</label>
          <input id="auth-email" type="email" required placeholder="nama@email.com" class="w-full bg-[#131317] text-sm font-medium text-white px-4 py-2.5 rounded-none border-2 border-white/80 shadow-[3px_3px_0px_#000000] focus:outline-none focus:border-[#e50914] focus:ring-0"/>
        </div>
        <div>
          <label class="block text-xs font-extrabold uppercase tracking-wider text-slate-200 mb-1">Password</label>
          <input id="auth-password" type="password" required placeholder="Minimal 6 karakter" class="w-full bg-[#131317] text-sm font-medium text-white px-4 py-2.5 rounded-none border-2 border-white/80 shadow-[3px_3px_0px_#000000] focus:outline-none focus:border-[#e50914] focus:ring-0"/>
        </div>
        <div id="field-phone" class="hidden">
          <label class="block text-xs font-extrabold uppercase tracking-wider text-slate-200 mb-1">Nomor HP / WhatsApp (Opsional)</label>
          <input id="auth-phone" type="tel" placeholder="0812xxxxxxxx" class="w-full bg-[#131317] text-sm font-medium text-white px-4 py-2.5 rounded-none border-2 border-white/80 shadow-[3px_3px_0px_#000000] focus:outline-none focus:border-[#e50914] focus:ring-0"/>
        </div>

        <p id="auth-error" class="hidden text-xs font-bold text-white bg-[#e50914] border-2 border-white rounded-none px-3 py-2 shadow-[3px_3px_0px_#000000]"></p>

        <button type="submit" id="auth-submit-btn" class="w-full py-3 rounded-none bg-[#e50914] hover:bg-[#c0000c] text-white text-sm font-extrabold uppercase tracking-wider border-[3px] border-white shadow-[5px_5px_0px_#000000] active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all">
          Masuk Sekarang
        </button>
      </form>
    </div>
  </div>

  <!-- Toast Notification (Neo-Brutalism) -->
  <div id="toast" class="fixed bottom-6 right-6 z-50 px-5 py-3 rounded-none bg-[#1f1f23] border-2 border-white text-white text-xs font-extrabold uppercase tracking-wide shadow-[5px_5px_0px_#e50914] flex items-center gap-2.5 opacity-0 translate-y-4 pointer-events-none transition-all duration-200">
    <span class="material-symbols-outlined text-[#e50914] text-lg">info</span>
    <span id="toast-text"></span>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
